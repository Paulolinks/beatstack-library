appId: com.beatstack.library
productName: BeatStack Library
copyright: Copyright © BeatStack
artifactName: ${productName}-Setup-${version}.${ext}
extraMetadata:
  version: "1.3.3"
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
directories:
  output: dist-electron
files:
  - desktop/**/*
  - "!desktop/**/*.map"
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: desktop/default-server.json
    to: default-server.json
  - from: legal
    to: legal
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  publisherName: BeatStack
  signAndEditExecutable: false
mac:
  category: public.app-category.music
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target: dmg
  # Sem certificado Apple: pula a assinatura normal e assina ad-hoc no afterSign
  # (o Mac pede "Abrir mesmo assim" na 1ª vez)
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
afterSign: scripts/mac-adhoc-sign.cjs
dmg:
  title: ${productName} ${version}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: BeatStack Library
  uninstallDisplayName: BeatStack Library
  license: legal/installer-notice.txt
  installerLanguages:
    - pt_BR
    - en_US
